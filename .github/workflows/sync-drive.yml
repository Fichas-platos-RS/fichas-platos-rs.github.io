name: Sincronizar Drive y publicar

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.commit.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Copias de los PDF guardadas entre ejecuciones (no se suben al repo)
      - name: Recuperar PDF ya descargados
        uses: actions/cache/restore@v4
        with:
          path: pdfs
          key: pdfs-${{ github.run_id }}
          restore-keys: pdfs-

      - name: Leer Drive y descargar PDF nuevos o modificados
        id: sync
        run: |
          before=$(sha256sum pdfs/.manifest.json 2>/dev/null || echo none)
          python3 scripts/sync_drive.py
          after=$(sha256sum pdfs/.manifest.json 2>/dev/null || echo none)
          [ "$before" != "$after" ] && echo "pdfs_changed=true" >> "$GITHUB_OUTPUT" || true

      - name: Commit si hay cambios
        id: commit
        run: |
          if git diff --quiet -- files.json && git ls-files --error-unmatch files.json >/dev/null 2>&1; then
            echo "Sin cambios"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add files.json
            git commit -m "Actualiza lista de PDF desde Drive"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar PDF descargados
        if: steps.sync.outputs.pdfs_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: pdfs
          key: pdfs-${{ hashFiles('files.json') }}-${{ github.run_id }}

      - name: Preparar web
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir _site
          cp index.html files.json README.md _site/
          mkdir _site/pdfs
          cp pdfs/*.pdf _site/pdfs/
          touch _site/.nojekyll
          du -sh _site

      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
