<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Buscador de Platos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2129;
      --surface-hover: #232b36;
      --border: #2d3748;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 520px;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .search-box {
      position: relative;
      margin-bottom: 24px;
    }
    input[type="search"] {
      width: 100%;
      padding: 18px 20px 18px 52px;
      font-size: 1.1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
    }
    input[type="search"]::placeholder { color: var(--text-muted); }
    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .status {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 16px;
      min-height: 1.2em;
    }
    .results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.15s, transform 0.1s;
      cursor: pointer;
    }
    .card:hover {
      background: var(--surface-hover);
    }
    .card:active { transform: scale(0.985); }
    .info { flex: 1; min-width: 0; }
    .code {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .name {
      font-size: 0.95rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .open-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .open-btn:hover { background: var(--accent-hover); }
    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 20px;
    }
    footer {
      margin-top: auto;
      padding-top: 32px;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Buscador de Platos</h1>
      <p class="subtitle">Escanea el QR o NFC y busca por código o nombre</p>
    </header>

    <div class="search-box">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="search" id="search" placeholder="Código (ej. 490) o nombre del plato" autofocus autocomplete="off">
    </div>

    <div id="status" class="status">Cargando platos...</div>
    <div id="results" class="results"></div>
  </div>

  <footer>
    Sincronizado con Google Drive · Actualización automática
  </footer>

  <script>
    // La lista de PDF (files.json) se regenera automáticamente desde Google Drive
    // cada ~10 minutos mediante GitHub Actions (.github/workflows/sync-drive.yml).

    const searchInput = document.getElementById('search');
    const resultsDiv = document.getElementById('results');
    const statusDiv = document.getElementById('status');

    let allFiles = [];

    function parseFile(file) {
      const name = file.name.replace(/\.pdf$/i, '');
      const match = name.match(/^([A-Za-z]{0,3}\d+)\s*[-–—]\s*(.+)$/);
      if (match) {
        return { code: match[1], title: match[2].trim(), id: file.id, fullName: file.name, local: file.local !== false, v: file.v || '' };
      }
      // Fallback: try to extract any leading number
      const numMatch = name.match(/^([A-Za-z]{0,3}\d+)/);
      return {
        code: numMatch ? numMatch[1] : '',
        title: name,
        id: file.id,
        fullName: file.name,
        local: file.local !== false,
        v: file.v || ''
      };
    }

    async function loadFiles() {
      try {
        const res = await fetch(`./files.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Error ${res.status}`);
        const data = await res.json();
        allFiles = (Array.isArray(data) ? data : [])
          .filter(f => f.name.toLowerCase().endsWith('.pdf'))
          .filter(f => !f.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().includes('borrar'))
          .map(parseFile);
        statusDiv.textContent = `${allFiles.length} platos disponibles`;
        renderResults(searchInput.value);
      } catch (err) {
        statusDiv.textContent = 'Error al cargar la lista de platos. Inténtalo de nuevo en unos segundos.';
        console.error(err);
      }
    }

    function renderResults(query) {
      const q = query.trim().toLowerCase();
      let filtered = allFiles;

      if (q) {
        filtered = allFiles.filter(f => {
          const codeMatch = f.code && f.code.toLowerCase().includes(q);
          const nameMatch = f.title.toLowerCase().includes(q) || f.fullName.toLowerCase().includes(q);
          return codeMatch || nameMatch;
        });
        // Prefer exact code matches first
        filtered.sort((a, b) => {
          const aExact = a.code.toLowerCase() === q ? 0 : 1;
          const bExact = b.code.toLowerCase() === q ? 0 : 1;
          return aExact - bExact;
        });
      }

      if (filtered.length === 0) {
        resultsDiv.innerHTML = `<div class="empty">No se encontraron platos</div>`;
        return;
      }

      resultsDiv.innerHTML = filtered.slice(0, 50).map(f => `
        <div class="card" onclick="openPDF('${f.id}', ${f.local}, '${encodeURIComponent(f.v)}')">
          <div class="info">
            <div class="code">${f.code || '—'}</div>
            <div class="name">${f.title}</div>
          </div>
          <button class="open-btn" onclick="event.stopPropagation(); openPDF('${f.id}', ${f.local}, '${encodeURIComponent(f.v)}')">Abrir</button>
        </div>
      `).join('');
    }

    function openPDF(id, local, v) {
      // Copia local publicada en la web (se abre directo en el visor del móvil).
      // Si aún no está copiada, se usa el enlace de Drive como respaldo.
      window.location.href = local
        ? `./pdfs/${encodeURIComponent(id)}.pdf?v=${v || ''}`
        : `https://drive.google.com/file/d/${id}/view`;
    }

    searchInput.addEventListener('input', (e) => {
      renderResults(e.target.value);
    });

    // Auto-focus and load
    loadFiles();
    searchInput.focus();
  </script>
</body>
</html>
